name: setup

# Puts this family's projects in the pool and registers its health checks (setup_family.py). Run it by hand after changing
# family.py. The hub trusts this repo (s1d-labs/<family>) through the GitHub OIDC token; no secrets are needed.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"    # weekly (Monday 02:41 UTC): a new round of list pages; documents once a month

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
      - name: rounds
        if: github.event_name == 'schedule'
        run: |
          echo "ROUND=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
          echo "DOCS_ROUND=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - run: python setup_family.py
        env:
          SCRAPE_HUB_URL: https://scrape.s1d.me
